# git-cliff — the generator that owns CHANGELOG.md and the GitHub Release body (#1123).
#
# TWO call sites read this file, and they must agree:
#   * scripts/gen_changelog.py  — `--unreleased --tag vX.Y.Z --strip header`, run by
#     scripts/cut-release.sh on the release branch. Writes the [X.Y.Z] section of CHANGELOG.md.
#   * .github/workflows/release.yml — `--latest --strip header` at tag time. Writes the initial
#     GitHub Release body (later replaced by hand-authored prose).
#
# Both strip the header, so `header` below only ever reaches a full `git cliff -o CHANGELOG.md`.
# It is kept in sync with the real file header anyway, so that regeneration would reproduce the
# file rather than a stale copy of it.
#
# The commit SUBJECT is the published changelog line. That is the whole point of #1123, and it is
# why the parsers below are conservative: a type that is skipped here is a change no reader of the
# changelog will ever learn about.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
Versioning follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Entries are **generated from conventional-commit subjects** by [git-cliff](https://git-cliff.org)
when a release is cut (#1123) — do not edit this file by hand. Changes that are not yet in a
release are the commits on `main` since the
[latest release](https://github.com/fighters-legacy/fighters-legacy/releases/latest).

"""
# `group` carries an `<!-- N -->` ordering prefix that `striptags` removes before it reaches the
# file; without it the sections come out in whatever order Tera's `group_by` yields (alphabetical),
# which puts Removed after Fixed and Keep a Changelog says the opposite.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Keep a Changelog's six headings, with 2/3/5 reserved: Conventional Commits has no `deprecate`,
# `remove` or `security` type, so nothing can land in Deprecated/Removed/Security until one is
# introduced. The numbers are held open rather than renumbered later, which would silently reorder
# every section in the file.
commit_parsers = [
  { message = "^feat",     group = "<!-- 0 -->Added"   },
  { message = "^docs",     group = "<!-- 1 -->Changed" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^perf",     group = "<!-- 1 -->Changed" },
  # A revert is the one commit class where silence is actively misleading — a reader who saw the
  # original entry ship needs to be told it was taken back. Unmapped, `filter_commits` drops it.
  { message = "^revert",   group = "<!-- 1 -->Changed" },
  { message = "^fix",      group = "<!-- 4 -->Fixed"   },
  { message = "^chore",    skip = true       },
  { message = "^ci",       skip = true       },
  { message = "^build",    skip = true       },
  { message = "^test",     skip = true       },
  { message = "^style",    skip = true       },
]
filter_commits = true
# A `chore!:` or `build!:` carrying a BREAKING CHANGE footer would otherwise be dropped by the skip
# rules above — the single worst thing to omit from a changelog.
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
