name: "Demo: Night Patrol"
map: world
layer: world_clear
anchor: home
time: { hour: 22, minute: 30 }
wind: { heading: 310, speed: 9 }
sides: [blue]
# A two-ship night CAP orbits the builtin airfield under a geographically-correct star field and a
# phase-lit Moon (#468/#484). Shows the spherical-Earth night sky, the airfield with its flattened
# runway + procedural markings, and the aircraft silhouetted against the stars. Zero content pack.
#
# `anchor: home` (#1211) puts the field where the sandbox home now is: 36.25 N, elevation ~570 m.
# Coordinates below are metres EAST and NORTH of the field, with y as MSL altitude — so runway 090
# runs along +east from the field centre (x -1250 .. +1250), which is what the shots frame. At the
# old world origin the runway ran mostly along world -Z, because the ENU basis rotates ~74 degrees
# over the 4 km from the pole to the field; that is the whole reason home moved.
#
# The patrol flies a route rather than `ai: "loiter <x> <y> <z> ..."`: a behaviour's ARGUMENTS are
# world coordinates and are NOT anchor-relative, so a loiter centre cannot be authored in this frame.
objects:
  - { type: builtin:debug-entity, id: night1, side: blue, pos: [0, 1400, -2400], heading: 90, speed: 160,
      route: [ [2600, 1400, 2400] ] }
  - { type: builtin:debug-entity, id: night2, side: blue, pos: [-600, 1600, 2600], heading: 270, speed: 160,
      route: [ [-3000, 1600, -2200] ] }
  - { type: builtin:static-target, id: pad, side: blue, pos: [300, 0, 320], heading: 90, start: ground }
triggers:
  - on: timer(75)
    do: mission_success
cameras:
  shots:
    # Low at the field edge, pitched up at the star field + Moon; an aircraft crosses the frame.
    - { type: static, start: 0, duration: 10, pos: [600, 585, 900], look_at: [200, 2100, -300], fov: 60 }
    # Orbit one patroller silhouetted against the night sky (clockwise).
    - { type: orbit, start: 10, duration: 12, target: night1, radius: 420, height: 110, period: -30 }
    # Slide low along the runway centreline — the flattened surface and procedural markings.
    - { type: move, start: 22, duration: 10, look_at: [1400, 576, 0], ease: smooth,
        keyframes: [ { time: 0, pos: [-1150, 582, 40] }, { time: 10, pos: [1200, 586, 40] } ] }
    # Wide closing frame over the lit field under the stars.
    - { type: static, start: 32, duration: 8, pos: [0, 1500, -2400], look_at: night1, fov: 58 }
