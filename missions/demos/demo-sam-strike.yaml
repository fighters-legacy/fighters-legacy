name: "Demo: SAM Strike"
map: world
layer: world_clear
time: { hour: 15, minute: 30 }
wind: { heading: 200, speed: 6 }
sides: [blue, red]
# A blue strike pair pushes on a red SAM + AAA site. builtin:sam-site fires its SARH on a reload
# interval; builtin:aaa leads with ballistic gunfire. Cameras stage from the site (launch plumes),
# chase the inbound striker, then orbit the engagement. Zero content pack.
objects:
  - { type: builtin:debug-entity, id: striker1, side: blue, pos: [-6000, 2200, 0], heading: 90, ai: "lua builtin:fighter" }
  - { type: builtin:debug-entity, id: striker2, side: blue, pos: [-6000, 2200, 500], heading: 90, ai: "lua builtin:fighter" }
  - { type: builtin:sam-site, id: sam1, side: red, pos: [0, 0, 0], heading: 90, ai: "sam" }
  - { type: builtin:aaa, id: aaa1, side: red, pos: [400, 0, 300], heading: 90, ai: "aaa" }
  - { type: builtin:debug-entity, id: cap1, side: red, pos: [2500, 2000, 0], heading: 270, ai: "lua builtin:fighter" }
triggers:
  - on: destroy(sam1)
    do: mission_success
  - on: timer(120)
    do: mission_failure
cameras:
  shots:
    # Ground-level static at the site looking back up the threat axis — catches launch plumes.
    - { type: static, start: 0, duration: 8, pos: [-350, 40, 250], look_at: sam1, fov: 50 }
    # Chase the inbound striker as it runs in on the site.
    - { type: chase, start: 8, duration: 14, target: striker1, offset: [-100, 22, 0], stiffness: 2.5, look_at: sam1 }
    # Orbit the site during the engagement.
    - { type: orbit, start: 22, duration: 14, target: sam1, radius: 700, height: 200, period: 34 }
    # Wide static over the whole fight as the CAP merges.
    - { type: static, start: 36, duration: 8, pos: [-1800, 1400, -1200], look_at: striker1, fov: 55 }
