SPDX-FileCopyrightText = "2026 MKZ Systems LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "cmake/**.h.in"
SPDX-FileCopyrightText = "2026 MKZ Systems LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
