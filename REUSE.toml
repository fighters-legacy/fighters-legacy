SPDX-License-Identifier = "GPL-3.0-or-later"

# libFuzzer seed corpora (#708): tiny synthetic binary wire artifacts minted by fuzz/mint_seeds.cpp.
# Binary seeds carry no inline SPDX header, so they are covered here.
[[annotations]]
path = ["fuzz/corpus/**", "fuzz/**.dict"]
SPDX-FileCopyrightText = "2026 MKZ Systems LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["AUTHORS", "NOTICE"]
SPDX-FileCopyrightText = "2026 MKZ Systems LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "LICENSES/**"
SPDX-FileCopyrightText = "Free Software Foundation, Inc."
SPDX-License-Identifier = "LicenseRef-scancode-public-domain"

[[annotations]]
path = ["platform/vulkan/UnifontBitmap.h", "platform/vulkan/UnifontBitmap.cpp"]
SPDX-FileCopyrightText = "Roman Czyborra, Paul Hardy, and GNU Unifont contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# World Magnetic Model 2025 Gauss coefficients (#483). Public-domain U.S. Government work produced by
# NOAA NCEI and NGA. The .COF format cannot carry an inline SPDX header (line 1 is the model epoch).
[[annotations]]
path = "data/WMM.COF"
SPDX-FileCopyrightText = "NOAA National Centers for Environmental Information (NCEI) / NGA"
SPDX-License-Identifier = "LicenseRef-scancode-public-domain"
