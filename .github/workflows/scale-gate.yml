name: Scale Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # NOTE: no `schedule:` — the self-hosted reference runner is a VM on a dev box that is not online
  # 24/7, and GitHub does not queue missed cron runs (a scheduled run while the box is off silently
  # skips, giving false confidence). The strict tier is therefore manual `workflow_dispatch` only
  # (#569). Once an always-on self-hosted runner exists, re-enable scheduling by uncommenting the
  # crons below and adding `github.event_name == 'schedule'` back to the `reference-gate` job's `if`
  # (map `github.event.schedule` -> profile set in the `select-profiles` job):
  #   schedule:
  #     - cron: '30 6 * * *'   # nightly -> reference + overrun (#574) + congestion (#714)
  #     - cron: '0 4 * * 6'    # weekly  -> soak
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to run on the self-hosted reference runner'
        type: choice
        options: [reference, reference-enet, nightly, soak, entity-scale, overrun, congestion, entity-churn, weapons]
        default: reference

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Deterministic PR tier: Release build, modest client count, machine-independent hard gates
  # (bandwidth + admission + KB/s baseline). tick-Hz is a collapse tripwire; tick-ms is advisory.
  pr-gate:
    name: PR gate (Linux, profile=pr)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          gcc: 'true'

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-v2-ubuntu-latest-${{ hashFiles('cmake/dependencies.cmake') }}

      # Vulkan disabled: fl-server + bot_swarm are headless and don't need the renderer/glslang.
      # Matches tools/bot_swarm/reference-env/run-benchmark.sh — a known-good Release config.
      - name: Configure (Release, headless)
        # GNS off on the PR tier: bot_swarm defaults to enet6 (the regression instrument) and an
        # enet6-only build keeps this leg fast (no protobuf/OpenSSL dep). The GNS-vs-GNS profile
        # (#649) runs on the reference runner, where 128 clients are meaningful — see the `gns` leg.
        run: cmake --preset release -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON -DFL_ENABLE_GNS=OFF

      - name: Build fl-server + bot_swarm
        run: cmake --build --preset release --target fl-server bot_swarm

      - name: Run scale gate (pr profile)
        run: |
          python3 tools/bot_swarm/scale_gate.py \
            --profile pr --build-dir build/release \
            --baseline tools/bot_swarm/scale-gate-baseline.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scale-gate-pr-reports
          path: tools/bot_swarm/results/*.json
          if-no-files-found: ignore

  # Bitrot guard for run_loadtest.ps1 — same 8-client/3s scale as the Linux smoke; no perf assert.
  windows-smoke:
    name: Windows .ps1 smoke
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: '1.3.290.0'
          cache: true

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-v2-windows-latest-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset release-msvc -DFL_ENABLE_GNS=OFF

      - name: Build fl-server + bot_swarm
        run: cmake --build --preset release-msvc --target fl-server bot_swarm

      - name: Smoke run_loadtest.ps1 (8 clients, 3s)
        shell: pwsh
        run: .\tools\bot_swarm\run_loadtest.ps1 build\release-msvc 8 3 weave

  # Cheap hosted orchestration: expand the dispatched profile into a JSON list of matrix "legs".
  # Kept off the sensitive self-hosted runner, and structured so a future `github.event.schedule`
  # branch (deferred cron) drops in here without touching the benchmark job.
  select-profiles:
    name: Select profiles
    if: >-
      github.repository == 'fighters-legacy/fighters-legacy' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.pick.outputs.legs }}
    steps:
      - id: pick
        env:
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          case "$PROFILE" in
            # `nightly` = the deferred nightly cron's set: the raw-capacity reference run (GNS —
            # the DEFAULT internet transport, the headline numbers; #773), the enet6 regression
            # leg at the same scale (`reference-enet` — the LAN/single-player backend), the
            # synthetic tick-overrun profile (#574, governor ON via FL_LOADTEST_GOVERNOR=1 from the
            # profile's `governor: true`), and the synthetic congestion profile (#714, lossy-proxy
            # degrade window via the profile's --degrade-* flags).
            nightly) legs='[{"profile":"reference"},{"profile":"reference-enet"},{"profile":"overrun"},{"profile":"congestion"}]' ;;
            *)       legs="[{\"profile\":\"$PROFILE\"}]" ;;
          esac
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "Selected legs: $legs"

  # Strict tier on the self-hosted 8-core/16GB reference VM (#569): full 128-client reference / soak
  # runs where the `≤ 16.6 ms p99` tick gate is meaningful, so `--strict` is UNCONDITIONAL here.
  #
  # SECURITY INVARIANT (self-hosted runner on a PUBLIC repo): this job must never execute fork-PR
  # code. It is gated to `workflow_dispatch` (only write-access holders can trigger) on the canonical
  # repo, and gated again on `vars.FL_REFERENCE_RUNNER_READY` (the operator's on-switch, also the
  # off-switch when the VM is torn down). There is no `pull_request`/fork path to this runner — the
  # PR tier stays on hosted runners above. Do NOT add `pull_request`/`pull_request_target` triggers.
  reference-gate:
    name: Reference gate (profile=${{ matrix.leg.profile }})
    needs: select-profiles
    if: >-
      github.repository == 'fighters-legacy/fighters-legacy' &&
      github.event_name == 'workflow_dispatch' &&
      vars.FL_REFERENCE_RUNNER_READY == 'true'
    runs-on: [self-hosted, linux, x64, fl-reference]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1 # one benchmark at a time on the single reference box (isolation)
      matrix:
        leg: ${{ fromJSON(needs.select-profiles.outputs.legs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure (Release, headless)
        # FL_ENABLE_GNS=ON for EVERY reference-runner leg (#773): the headline profiles
        # (`reference`, `soak`) and the characterisation profiles (`overrun`, `congestion`,
        # `entity-scale`, `entity-churn`) all pin `transport: gns` — GNS is the default internet
        # transport, so the published numbers describe what ships. The enet6 legs (`reference-enet`
        # here, `pr` on hosted runners) run fine in a GNS-enabled build: bot_swarm's default
        # transport is enet6 and the profile does not set FL_LOADTEST_TRANSPORT.
        #
        # FL_ALLOW_SHARED_PROTOBUF=ON (#1136): the reference runner is the Fedora VM, and Fedora
        # ships no static libprotobuf, so the static-only preference in dependencies.cmake would
        # fail the find with every package correctly installed — force-disabling GNS on the one
        # runner whose whole job is measuring it. This binary is a measurement binary that never
        # leaves the runner; the static preference exists for artefacts that ship (#905).
        run: |
          cmake --preset release -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON -DFL_ENABLE_GNS=ON \
                -DFL_ALLOW_SHARED_PROTOBUF=ON
          # KEY GUARD (same trap as #653): cmake/dependencies.cmake *silently* force-disables GNS
          # when OpenSSL/protobuf are missing, so a misprovisioned runner would build enet6-only and
          # every GNS leg would happily measure enet6 and pass. Fail the leg instead. (bot_swarm
          # also refuses --transport gns in an enet6-only build, and scale_gate.py cross-checks the
          # report's `transport` key — three independent ways this cannot pass silently.)
          if ! grep -qx 'FL_ENABLE_GNS:BOOL=ON' build/release/CMakeCache.txt; then
            echo "::error::FL_ENABLE_GNS was force-disabled during configure — the runner is missing"\
                 "OpenSSL/protobuf dev packages (see tools/bot_swarm/reference-env/vm-provision.sh)."
            exit 1
          fi

      - name: Build fl-server + bot_swarm
        run: cmake --build --preset release --target fl-server bot_swarm

      - name: Run scale gate (strict)
        run: |
          python3 tools/bot_swarm/scale_gate.py \
            --profile "${{ matrix.leg.profile }}" \
            --build-dir build/release \
            --baseline tools/bot_swarm/scale-gate-baseline.json \
            --strict

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scale-gate-${{ matrix.leg.profile }}-reports
          path: tools/bot_swarm/results/*.json
          if-no-files-found: ignore
