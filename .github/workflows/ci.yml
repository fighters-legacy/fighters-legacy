name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          clang_format: 'true'

      - name: REUSE compliance check
        uses: fsfe/reuse-action@v4

      - name: Check clang-format
        run: |
          git diff --name-only --diff-filter=d origin/${{ github.base_ref || 'main' }}...HEAD \
            | grep -E '\.(cpp|h|hpp|c)$' \
            | xargs -r clang-format-22 --dry-run --Werror

  build:
    needs: [lint]
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNS builds on all three platforms (#653). Each solves the protobuf dependency
          # differently — GNS v1.6.0 needs the pre-abseil 3.21.x protobuf line:
          #   Linux:   system libprotobuf-dev (Ubuntu ships 3.21.x) via install-linux-deps.
          #   Windows: vcpkg manifest (vcpkg.json pins protobuf 3.21.12) under the vcpkg
          #            toolchain; static-md triplet matches the /MD(d) CRT of our presets.
          #   macOS:   pinned Homebrew formula protobuf@21 (= 3.21.12, keg-only) surfaced via
          #            CMAKE_PREFIX_PATH — the main `protobuf` formula is the abseil-based 5.x
          #            line GNS v1.6.0 does not build against.
          - os: windows-latest
            preset: debug-msvc
            gns_flag: ''
            extra_flags: '-DVCPKG_TARGET_TRIPLET=x64-windows-static-md'
          - os: ubuntu-latest
            preset: debug
            gns_flag: ''
            extra_flags: ''
          - os: macos-latest
            preset: debug
            gns_flag: ''
            extra_flags: ''

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/install-linux-deps
        with:
          vulkan: 'true'
          gcc: 'true'
          python_tools: 'true'
          gns: 'true'

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # protobuf@21 (keg-only 3.21.12) + openssl@3 feed the GNS build (#653); the main
          # `protobuf` formula is the abseil-based 5.x line GNS v1.6.0 does not build against.
          brew install cmake ninja vulkan-headers molten-vk vulkan-loader glslang protobuf@21 openssl@3 zstd

      - name: Set up GNS dependencies (macOS)
        if: matrix.os == 'macos-latest'
        # Keg-only formulas are not in the default search paths: surface protobuf@21 via
        # CMAKE_PREFIX_PATH (prefix entries win over the standard paths, so even an installed
        # abseil-based main protobuf cannot shadow it) and point FindOpenSSL at brew's openssl@3
        # (the system library is LibreSSL). Both env vars are consumed natively by CMake.
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix protobuf@21)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: '1.3.290.0'
          cache: true

      - name: Cache vcpkg binary cache (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v6
        with:
          path: vcpkg-bincache
          key: vcpkg-bincache-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Set up GNS dependencies (Windows, vcpkg protobuf)
        if: matrix.os == 'windows-latest'
        # The vcpkg toolchain (runner-preinstalled clone) builds protobuf 3.21.12 from the
        # repo-root vcpkg.json manifest at configure time (#653). CMAKE_TOOLCHAIN_FILE is
        # honored as an env var by CMake >= 3.21; the binary cache makes later runs a restore.
        shell: pwsh
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\vcpkg-bincache" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vcpkg-bincache" | Out-Null

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-v2-${{ matrix.os }}-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Set up MSVC developer environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.gns_flag }} ${{ matrix.extra_flags }}

      # dependencies.cmake force-disables FL_ENABLE_GNS when OpenSSL/protobuf are not found, so a
      # broken dependency setup would otherwise SILENTLY build enet6-only and pass this leg. Assert
      # the cache still says ON — the whole point of these legs is validating the GNS build (#653).
      - name: Verify GNS is enabled (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: grep -q "FL_ENABLE_GNS:BOOL=ON" build/debug/CMakeCache.txt || (echo "GNS was force-disabled at configure — protobuf/OpenSSL not found" && exit 1)

      - name: Verify GNS is enabled (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Select-String -Path build\debug-msvc\CMakeCache.txt -Pattern 'FL_ENABLE_GNS:BOOL=ON' -Quiet)) {
            Write-Error "GNS was force-disabled at configure — protobuf/OpenSSL not found"
          }

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Smoke test fighters-legacy --version (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: ./build/debug/game/fighters-legacy/fighters-legacy --version

      - name: Smoke test fighters-legacy --version (Windows)
        if: matrix.os == 'windows-latest'
        run: .\build\debug-msvc\game\fighters-legacy\fighters-legacy.exe --version
        shell: pwsh

      - name: Smoke test fl-server --version (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: ./build/debug/server/fl-server/fl-server --version

      - name: Smoke test fl-server --version (Windows)
        if: matrix.os == 'windows-latest'
        run: .\build\debug-msvc\server\fl-server\fl-server.exe --version
        shell: pwsh

      # A release is the worst possible place to discover that a binary stopped being packaged, so
      # the check runs on the PR instead (#814). If a target is renamed in CMake, or dropped from the
      # install set, THIS fails -- not the release three weeks later.
      - name: Verify the release install set (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cmake --install build/debug --prefix /tmp/dist --component runtime
          cmake --install build/debug --prefix /tmp/dist --component tools
          missing=0
          for f in fighters-legacy fl-server validate-flight-model validate-weapon validate-sensor \
                   validate-entity validate-mission validate-mesh validate-playlist validate-licenses \
                   tex-compress fm-trim; do
            if [ ! -f "/tmp/dist/$f" ]; then echo "MISSING from the release archive: $f"; missing=1; fi
          done
          # fl-base-pack's CI downloads its validators from a fighters-legacy release; a missing one
          # silently disables a content gate over there.
          if [ ! -d /tmp/dist/shaders ] || [ -z "$(ls -A /tmp/dist/shaders)" ]; then
            echo "MISSING from the release archive: compiled shaders"; missing=1
          fi
          # The FetchContent dependencies are not EXCLUDE_FROM_ALL, so an unscoped install would drag
          # their headers and static libs into the archive. Component scoping is what stops that.
          leaked=$(find /tmp/dist \( -name '*.h' -o -name '*.hpp' -o -name '*.a' -o -name '*.cmake' \) | wc -l)
          if [ "$leaked" -ne 0 ]; then
            echo "dependency files leaked into the release archive:"; find /tmp/dist \( -name '*.h' -o -name '*.a' \); missing=1
          fi
          exit $missing

      - name: Smoke test tools (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          ./build/debug/tools/validate-flight-model --version
          ./build/debug/tools/validate-mission --version
          ./build/debug/tools/validate-weapon --version
          ./build/debug/tools/validate-sensor --version
          ./build/debug/tools/validate-entity --version
          ./build/debug/tools/validate-mesh --version
          ./build/debug/tools/fm-trim --version
          # The builtin reference meshes (docs/modding/3d-models.md) must validate with zero
          # warnings or errors — clean validation prints nothing, so fail on any output.
          python3 tools/gen_builtin_glb.py --export-dir /tmp/builtin-meshes
          mesh_out=$(./build/debug/tools/validate-mesh /tmp/builtin-meshes/builtin_entity.glb /tmp/builtin-meshes/builtin_floor.glb 2>&1)
          if [ -n "$mesh_out" ]; then echo "builtin reference meshes failed validation:"; echo "$mesh_out"; exit 1; fi
          ./build/debug/tools/tex-compress --version
          ./build/debug/tools/validate-licenses --version
          ./build/debug/tools/validate-playlist --version
          ./build/debug/tools/terrain-chunk-io --version
          # --transport enet: net_check is an enet6 client, so the smoke server must speak enet6
          # (fl-server defaults to GNS when built with FL_ENABLE_GNS).
          ./build/debug/server/fl-server/fl-server 7002 1 --transport enet &
          FL_SERVER_PID=$!
          # Wait up to 10 s for the server to finish startup (primeSpawnHeight can block up to
          # 5 s on first run with no cached terrain chunks, e.g. in CI without content packs).
          sleep 10
          ./build/debug/tools/net_check 127.0.0.1 7002 --count 3 --interval 100
          ./build/debug/tools/net_check 127.0.0.1 7002 --bench 30 --bench-rate 60
          kill "$FL_SERVER_PID" 2>/dev/null || true
          # bot_swarm load-harness smoke. run_loadtest.sh launches its own fl-server with a
          # load-test config — the default connect_rate_limit_count=5 would reject 8 rapid
          # connects. A nonzero exit (clients refused/dropped) fails the step under set -e.
          bash tools/bot_swarm/run_loadtest.sh build/debug 8 3 weave

      - name: Smoke test asset pipeline tools (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\build\debug-msvc\tools\validate-flight-model.exe --version
          .\build\debug-msvc\tools\validate-mission.exe --version
          .\build\debug-msvc\tools\validate-weapon.exe --version
          .\build\debug-msvc\tools\validate-sensor.exe --version
          .\build\debug-msvc\tools\validate-entity.exe --version
          .\build\debug-msvc\tools\validate-mesh.exe --version
          .\build\debug-msvc\tools\tex-compress.exe --version
          .\build\debug-msvc\tools\validate-licenses.exe --version
          .\build\debug-msvc\tools\validate-playlist.exe --version
          .\build\debug-msvc\tools\terrain-chunk-io.exe --version
        shell: pwsh

      - name: Verify static linking (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Guards our bundled libs (statically linked). GNS's libssl/libcrypto/libprotobuf are
          # intentionally dynamic system deps (like libc) and are not in the reject set.
          # vorbis|ogg guards the FetchContent-pinned decoder (#723) against a system pickup.
          bad=$(ldd build/debug/game/fighters-legacy/fighters-legacy \
                | grep -Ei "sdl3|openal|ktx|vorbis|ogg" || true)
          [ -z "$bad" ] || (echo "Unexpected dynamic deps: $bad" && exit 1)
          # fl-server is headless: no client backend may reach it (#711 dropped SDL3; #713
          # guards the full set — the binary-level backstop for cmake/layering.cmake).
          bad_srv=$(ldd build/debug/server/fl-server/fl-server \
                    | grep -Ei "sdl3|vulkan|openal" || true)
          [ -z "$bad_srv" ] || (echo "fl-server links a client backend: $bad_srv" && exit 1)

      - name: Configure OpenAL Soft null backend
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "$HOME/.config"
          printf '[general]\ndrivers = null\n' > "$HOME/.config/alsoft.conf"

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Unit test gen_terrain_chunks.py (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m pytest tests/test_gen_terrain_chunks.py -v

      - name: Unit test gen_terrain_tiles.py (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m pytest tests/test_gen_terrain_tiles.py -v

      - name: Unit test gen_unifont_header.py (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m pytest tests/test_gen_unifont_header.py -v

      - name: Unit test latency_analysis/compare.py (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m pytest tests/test_latency_compare.py -v

      - name: Unit test bot_swarm/scale_gate.py (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m pytest tests/test_scale_gate.py -v

      # Pure scoring/extraction logic only — no endpoint is contacted. CI never requires a model
      # (docs/ai-architecture.md section 7); the sweep itself is run locally / on the reference env.
      - name: Unit test ai_eval/ai_eval.py (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m pytest tests/test_ai_eval.py -v

      - name: Smoke test gen_unifont_header.py --help (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/gen_unifont_header.py --help

      - name: Smoke test terrain-chunk-io gen-procedural (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./build/debug/tools/terrain-chunk-io gen-procedural \
            --face 2 --level 0 --i 0 --j 0 --output /tmp/builtin_tile.u16

          python3 - <<'EOF'
          import struct
          with open("/tmp/builtin_tile.u16", "rb") as f:
              magic, w, h = struct.unpack("<IHH", f.read(8))
          assert magic == 0x464C4348, f"wrong magic: {magic:#x}"
          assert w == 129 and h == 129, f"wrong size: {w}x{h}"
          print(f"OK: terrain-chunk-io gen-procedural output valid ({w}x{h}, magic {magic:#x})")
          EOF

      - name: Smoke test gen_terrain_chunks.py (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 tools/gen_terrain_chunks.py --help

          python3 - <<'EOF'
          from osgeo import gdal, osr
          import numpy as np
          ds = gdal.GetDriverByName("GTiff").Create(
              "/tmp/test_dem.tif", 256, 256, 1, gdal.GDT_Int16)
          srs = osr.SpatialReference()
          srs.ImportFromEPSG(4326)
          ds.SetProjection(srs.ExportToWkt())
          ds.SetGeoTransform([30.0, 30.0 / 111111.0, 0, 42.0, 0, -30.0 / 111111.0])
          ds.GetRasterBand(1).WriteArray(
              np.random.randint(0, 500, (256, 256), dtype=np.int16))
          ds.FlushCache()
          EOF

          python3 tools/gen_terrain_chunks.py \
            --input /tmp/test_dem.tif \
            --terrain-id world \
            --chunk-size-m 15360 \
            --grid-width 1 --grid-height 1 \
            --srs EPSG:32637 \
            --workers 1 \
            --output-dir /tmp/terrain-out \
            --write-manifest

          python3 - <<'EOF'
          from osgeo import gdal
          import json, sys
          for lod, (w, h) in enumerate([(513, 513), (257, 257), (129, 129)]):
              ds = gdal.Open(f"/tmp/terrain-out/terrain/world/lod{lod}/chunk_0000_0000.png")
              assert ds is not None, f"lod{lod} chunk missing"
              assert ds.RasterXSize == w and ds.RasterYSize == h, \
                  f"lod{lod}: expected {w}x{h}, got {ds.RasterXSize}x{ds.RasterYSize}"
              assert ds.GetRasterBand(1).DataType == 2, \
                  f"lod{lod}: expected GDT_UInt16 (2), got {ds.GetRasterBand(1).DataType}"
          m = json.load(open("/tmp/terrain-out/terrain/world.json"))
          assert m["chunk_size_m"] == 15360
          assert m["grid_width"] == 1 and m["grid_height"] == 1
          assert m["lod_levels"] == 3
          print("OK: all chunk sizes, dtypes, and manifest fields correct")
          EOF

      - name: Smoke test gen_terrain_tiles.py (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 tools/gen_terrain_tiles.py --help

          # Synthesize a small GLOBAL lat/lon DEM + land-cover source (EPSG:4326, 360x180 = 1 deg/px).
          python3 - <<'EOF'
          from osgeo import gdal, osr
          import numpy as np
          srs = osr.SpatialReference(); srs.ImportFromEPSG(4326)
          def make(path, dtype, fill):
              ds = gdal.GetDriverByName("GTiff").Create(path, 360, 180, 1, dtype)
              ds.SetProjection(srs.ExportToWkt())
              ds.SetGeoTransform([-180.0, 1.0, 0, 90.0, 0, -1.0])  # north-up, 1 deg/px
              ds.GetRasterBand(1).WriteArray(fill)
              ds.FlushCache()
          make("/tmp/global_dem.tif", gdal.GDT_Int16,
               np.random.randint(0, 800, (180, 360), dtype=np.int16))
          make("/tmp/global_lc.tif", gdal.GDT_Byte,
               np.full((180, 360), 10, dtype=np.uint8))
          EOF

          python3 tools/gen_terrain_tiles.py \
            --input /tmp/global_dem.tif \
            --landcover-source /tmp/global_lc.tif \
            --terrain-id world \
            --faces 2 \
            --min-level 0 --max-level 1 \
            --workers 1 \
            --output-dir /tmp/tiles-out

          python3 - <<'EOF'
          from osgeo import gdal
          # Level 0: one +Y tile; level 1: four. Height + land-cover PNGs, 129x129 GDT_UInt16.
          expected = [(0, 0, 0)] + [(1, i, j) for j in range(2) for i in range(2)]
          for level, i, j in expected:
              for layer, suffix in (("height", ".png"), ("landcover", "_lc.png")):
                  p = f"/tmp/tiles-out/terrain/world/f2/l{level}/tile_{i}_{j}{suffix}"
                  ds = gdal.Open(p)
                  assert ds is not None, f"missing {layer} tile: {p}"
                  assert ds.RasterXSize == 129 and ds.RasterYSize == 129, \
                      f"{p}: expected 129x129, got {ds.RasterXSize}x{ds.RasterYSize}"
                  assert ds.GetRasterBand(1).DataType == 2, \
                      f"{p}: expected GDT_UInt16 (2), got {ds.GetRasterBand(1).DataType}"
          # The +Y face centre samples the north pole; its centre height decodes near sea level +
          # offset. Just confirm the encoding is in-range (non-zero, <= 65535).
          ds = gdal.Open("/tmp/tiles-out/terrain/world/f2/l0/tile_0_0.png")
          import numpy as np
          arr = ds.GetRasterBand(1).ReadAsArray()
          assert arr.min() > 0 and arr.max() <= 65535, "height encode out of range"
          print("OK: cube-sphere tile sizes, dtypes, and layers correct")
          EOF

  # ---------------------------------------------------------------------------
  # libFuzzer per-PR smoke (#708). fuzz-changes gates on touched paths and emits
  # a JSON matrix of harnesses; fuzz-run builds+smokes each; fuzz-smoke is the
  # single stable required check (green even when fuzz-run is skipped).
  # ---------------------------------------------------------------------------
  fuzz-changes:
    needs: [lint]
    name: Fuzz changes
    runs-on: ubuntu-latest
    outputs:
      harnesses: ${{ steps.set.outputs.harnesses }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect fuzzable changes and enumerate harnesses
        id: set
        run: |
          # A change to any fuzzable source, the fuzz scaffold, the build config, or this workflow
          # arms the smoke. Push events with an unknown/absent base run the full set.
          filter='^(engine|server|game|fuzz)/|^CMakeLists\.txt$|^CMakePresets\.json$|^\.github/workflows/ci\.yml$'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          elif git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            changed=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            changed="__ALL__"
          fi
          if [ "$changed" = "__ALL__" ] || echo "$changed" | grep -qE "$filter"; then
            harnesses=$(ls fuzz/fuzz_*.cpp | sed 's#^fuzz/##; s#\.cpp$##' | jq -R . | jq -sc .)
          else
            harnesses='[]'
          fi
          echo "Fuzzable change: ${harnesses}"
          echo "harnesses=${harnesses}" >> "$GITHUB_OUTPUT"

  fuzz-run:
    needs: [fuzz-changes]
    if: needs.fuzz-changes.outputs.harnesses != '[]'
    name: Fuzz (${{ matrix.harness }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.fuzz-changes.outputs.harnesses) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          clang: 'true'

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-v2-fuzz-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure
        run: cmake --preset fuzz

      - name: Build harness
        run: cmake --build --preset fuzz --target ${{ matrix.harness }}

      - name: Smoke (60 s over seed corpus)
        run: ctest --preset fuzz -R "^fuzz_smoke_${{ matrix.harness }}$" --output-on-failure

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ matrix.harness }}
          path: build/fuzz/fuzz/artifacts/${{ matrix.harness }}/
          if-no-files-found: ignore

  fuzz-smoke:
    needs: [fuzz-changes, fuzz-run]
    if: always()
    name: fuzz-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate fuzz result
        run: |
          result="${{ needs.fuzz-run.result }}"
          echo "fuzz-run result: ${result}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "Fuzz smoke failed."
            exit 1
          fi
          echo "Fuzz smoke OK (ran or skipped — no fuzzable change)."
