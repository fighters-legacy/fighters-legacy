name: ThreadSanitizer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # sized like asan; an apt-mirror hang must fail visibly in minutes, not squat for 6 h (#1216)

    # JOB-level, not per-step (#1265). Five of the six TSan run steps set this and one did not, so
    # test_world_broadcaster — the parallel-tick test, the one most likely to find a data race — ran
    # with neither halt_on_error nor the suppression file. Hoisting it means a new run step cannot
    # be added without it.
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tools/tsan.supp

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          clang: 'true'

      - name: Cache CMake FetchContent dependencies
        uses: ./.github/actions/cache-cmake-deps
        with:
          flavor: tsan

      - name: Configure
        # GNS off: the TSan scope (test_job_system + test_world_broadcaster + test_honest_sensing) links INetwork via mocks,
        # not platform-net; GNS spins its own threads and is excluded from the SDL/ENet-free scoping.
        run: cmake --preset tsan -DFL_ENABLE_GNS=OFF
        env:
          CC: clang
          CXX: clang++

      # Scope to the data-parallel sim targets: the engine-job pool and the WorldBroadcaster
      # parallel-tick test. These do NOT link SDL3/OpenAL/ENet/Vulkan, so the TSan run stays
      # focused on our parallel code rather than third-party (uninstrumented) library threads.
      - name: Build TSan targets
        run: cmake --build --preset tsan --target test_job_system test_world_broadcaster test_honest_sensing test_crew_frame test_turret_gunner test_world_state test_match_event_log test_faction_registry

      - name: Run job-system tests under TSan
        run: ./build/tsan/tests/test_job_system

      - name: Run WorldBroadcaster parallel-tick tests under TSan
        run: ./build/tsan/tests/test_world_broadcaster

      # World-state + match event log (#600): the sim thread publishes and appends while REST/MCP
      # read from their own threads, so the publication handoff and the log's lock are exactly the
      # kind of thing this job exists to check. Both link only engine-net (no SDL/ENet/Vulkan).
      # FactionRegistry (#1094): three tiers in one class -- load-once state read lock-free, an
      # UNLOCKED sim-thread-only relationship matrix, and mutex-guarded alert levels written from the
      # network thread while the sim reads them. The tiers are asserted in debug builds, but an
      # assertion only fires where a test drives the violation; TSan is what says the LEGAL concurrent
      # path (tier 3) is actually race-free. engine-world only, so no third-party threads.
      - name: Run faction-registry tests under TSan
        run: ./build/tsan/tests/test_faction_registry

      - name: Run world-state + match-event-log tests under TSan
        run: |
          ./build/tsan/tests/test_world_state
          ./build/tsan/tests/test_match_event_log

      # Crewed control frame (#966): the per-seat sample/slew/fire passes run inside the same
      # data-parallel tick, so their serial-equivalence needs the same race audit as the broadcaster.
      - name: Run crew-frame + turret-gunner tests under TSan
        run: |
          ./build/tsan/tests/test_crew_frame
          ./build/tsan/tests/test_turret_gunner

      # The sensing pass runs data-parallel over observers (#685). Its serial-equivalence guarantee is
      # only worth as much as the absence of a race underneath it.
      - name: Run test_honest_sensing under TSan
        run: ./build/tsan/tests/test_honest_sensing
