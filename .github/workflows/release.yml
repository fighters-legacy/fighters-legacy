name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNS is Linux-only for now (Windows: no runner protobuf; macOS: Homebrew protobuf 35 is the
          # abseil-based 5.x line GNS v1.6.0 does not build against). Both ship enet6-only.
          - os: windows-latest
            preset: release-msvc
            artifact: fighters-legacy-windows
            gns_flag: '-DFL_ENABLE_GNS=OFF'
          - os: ubuntu-latest
            preset: release
            artifact: fighters-legacy-linux
            gns_flag: ''
          - os: macos-latest
            preset: release
            artifact: fighters-legacy-macos
            gns_flag: '-DFL_ENABLE_GNS=OFF'

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/install-linux-deps
        with:
          gcc: 'true'
          clang: 'true'
          vulkan: 'true'
          gns: 'true'

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: '1.3.290.0'
          cache: true

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja vulkan-headers molten-vk vulkan-loader glslang

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-v2-${{ matrix.os }}-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Set up MSVC developer environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.gns_flag }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # A release binary must be self-contained: it has to run on any target-triple-compatible
      # machine, not only where a private libprotobuf.so happens to be on the loader path (#905).
      # The Linux release links GNS (protobuf); assert nothing is unresolved and protobuf is static.
      - name: Verify fl-server is self-contained (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          srv=build/${{ matrix.preset }}/server/fl-server/fl-server
          missing=$(ldd "$srv" | grep "not found" || true)
          [ -z "$missing" ] || (echo "fl-server has unresolved shared deps: $missing" && exit 1)
          dynpb=$(ldd "$srv" | grep -i protobuf || true)
          [ -z "$dynpb" ] || (echo "fl-server still dynamically links protobuf: $dynpb" && exit 1)
          echo "fl-server is self-contained:"; ldd "$srv"

      # ONE code path, both platforms, no hand-maintained list (#814). The two `cp` lists this
      # replaces had already drifted from each other, and neither shipped validate-weapon,
      # validate-sensor, or fl-server -- which the game spawns for single-player, so every release
      # was unplayable offline. install(TARGETS) in CMake now owns the set; --component keeps the
      # FetchContent dependencies' own install rules (SDL3, ktx, yaml-cpp, ...) out of the archive.
      - name: Package (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cmake --install build/${{ matrix.preset }} --prefix dist --component runtime
          cmake --install build/${{ matrix.preset }} --prefix dist --component tools
          # Bundle the coarse global base terrain (#474) next to the binary if present (produced
          # out-of-band by tools/build_global_base.sh). No-op until the base is generated/committed.
          if [ -d base-terrain ]; then cp -r base-terrain dist/base-terrain; fi
          cd dist && zip -r ../${{ matrix.artifact }}.zip .

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake --install build/${{ matrix.preset }} --prefix dist --component runtime
          cmake --install build/${{ matrix.preset }} --prefix dist --component tools
          # Bundle the coarse global base terrain (#474) next to the binary if present. No-op until generated.
          if (Test-Path base-terrain) { Copy-Item -Recurse base-terrain dist\base-terrain }
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}.zip -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Fallback release notes
        id: notes
        run: |
          body="${{ steps.cliff.outputs.content }}"
          if [ -z "${body// }" ]; then
            body="Infrastructure and CI improvements — no user-facing changes."
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        id: release
        with:
          body: ${{ steps.notes.outputs.body }}
          files: "dist/*.zip"

      - name: Attest build provenance
        if: hashFiles('**/*.zip') != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.zip"
