name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # ~2x observed worst (~43 min); an apt-mirror hang must fail visibly in minutes, not squat for 6 h (#1216)
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: github/codeql-action/init@v4.37.7
        with:
          languages: c-cpp

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          vulkan: 'true'

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v6
        with:
          # Every preset pins FETCHCONTENT_BASE_DIR to ${sourceDir}/build/_deps (CMakePresets.json
          # `base`), so deps never land under build/debug/. This used to cache a path that was never
          # written: an empty save, an empty restore, and a full re-download every run. The key is
          # codeql-specific because this job configures with FL_ENABLE_GNS=OFF, so its dep set
          # differs from the other workflows' v2 caches.
          path: build/_deps
          key: cmake-deps-v2-codeql-ubuntu-latest-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Configure
        # GNS off: avoids the protobuf/GNS build in the CodeQL autobuild (build-time + no need to
        # scan the third-party transport). The GnsNetwork backend is covered by the normal CI build.
        run: cmake --preset debug -DFL_ENABLE_GNS=OFF

      - name: Build
        run: cmake --build --preset debug

      - uses: github/codeql-action/analyze@v4.37.7
