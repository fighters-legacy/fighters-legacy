name: Locale Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # ~2x observed worst (~1 min) with headroom; an apt-mirror hang must fail visibly in minutes, not squat for 6 h (#1216)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          gcc: 'true'

      # This job configures the full debug preset, which downloads every FetchContent dependency,
      # and had no cache at all (#1265) — a fresh download on every push and every PR.
      - name: Cache CMake FetchContent dependencies
        uses: ./.github/actions/cache-cmake-deps
        with:
          flavor: ubuntu-latest

      - name: Configure
        run: cmake --preset debug

      - name: Build locale-extract
        run: cmake --build --preset debug --target locale-extract

      - name: Locale lint
        run: |
          ./build/debug/tools/locale-extract \
            --src engine \
            --locale locale \
            --dry-run
