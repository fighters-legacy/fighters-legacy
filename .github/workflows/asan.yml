name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ~2x observed worst (~18 min); an apt-mirror hang must fail visibly in minutes, not squat for 6 h (#1216)

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          clang: 'true'

      - name: Cache CMake FetchContent dependencies
        uses: ./.github/actions/cache-cmake-deps
        with:
          flavor: asan

      - name: Configure
        # GNS off: ASan/LSan value is our code; GNS + protobuf globals add third-party sanitizer noise.
        run: cmake --preset asan -DFL_ENABLE_GNS=OFF
        env:
          CC: clang
          CXX: clang++

      - name: Build
        run: cmake --build --preset asan

      - name: Configure OpenAL Soft null backend
        uses: ./.github/actions/openal-null-backend

      - name: Test
        run: ctest --preset asan --output-on-failure
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
