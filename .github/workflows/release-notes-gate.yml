name: Release notes gate

# Two defects this catches, both of which really happened and neither of which anything noticed:
#
#   1. A release published with git-cliff's autogenerated body and never hand-authored. v0.3.9
#      shipped this way — six PR-level bullets, no thematic summary — while the release process
#      recorded step 6 as done.
#   2. A release carrying ANOTHER version's notes. `gh release edit` was pointed at the wrong tag
#      at least twice: v0.3.9's notes landed on v0.3.8, and v0.2.5's on v0.2.6. Both times the
#      clobbered release advertised features it did not contain, for months.
#
# WHY THIS IS NOT A STEP IN release.yml: that workflow publishes the git-cliff body itself, so a
# check running inside it would fail on every release by construction — the prose is applied after
# the workflow completes (`softprops/action-gh-release` overwrites the body, which is the timing
# race that bit v0.3.8). A permanently-red check is one everyone learns to ignore.
#
# WHY THREE TRIGGERS, not just `release`:
#
#   * `workflow_run` on Release — release.yml publishes with GITHUB_TOKEN, and events created by
#     GITHUB_TOKEN do NOT trigger workflows (GitHub's recursion guard). So `release: published`
#     never fires for our own releases. Without this trigger the gate would only ever run on a
#     hand edit, i.e. it would pass every time and catch nothing — it would have been blind to
#     defect 1 above, the very case it exists for.
#   * `release: [published, edited]` — catches a hand edit (user token, so it does fire) and any
#     release published by something other than release.yml. This is what makes the gate
#     self-clearing: fix the body, the gate re-runs and goes green.
#   * `schedule` — a weekly sweep of EVERY release, not just the one being published. v0.3.8 and
#     v0.3.9 were both wrong for months; a publish-time-only check cannot see a release that
#     rotted after the fact.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published, edited]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Release notes are hand-authored and describe their own tag
    runs-on: ubuntu-latest
    steps:
      - name: Resolve which releases to check
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -uo pipefail
          case "$EVENT" in
            release)      tags="$RELEASE_TAG" ;;
            workflow_run) tags="$RUN_BRANCH" ;;   # a tag-push run's head_branch is the tag name
            *)            tags=$(gh release list --limit 200 --json tagName --jq '.[].tagName') ;;
          esac
          # A workflow_run for a non-tag push has no release to check.
          if [ "$EVENT" = "workflow_run" ] && ! gh release view "$tags" >/dev/null 2>&1; then
            echo "no release for '$tags' — nothing to check"; tags=""
          fi
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Check the release bodies
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ steps.scope.outputs.tags }}
        run: |
          set -uo pipefail
          bad=""
          {
            echo "## Release notes gate"
            echo
            echo "| tag | hand-authored | describes own version |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for tag in $TAGS; do
            [ -n "$tag" ] || continue
            # Read the body through the API. NEVER reference the release body as an Actions
            # expression inside a run block: Actions substitutes those BEFORE the script is
            # written, so the body's text becomes shell source. That is a code-execution vector,
            # and it is not hypothetical — this comment previously spelled the expression out and
            # broke the gate on the first release it ran against (the body's parentheses became
            # a syntax error). A body containing a command substitution would have executed.
            # The rule: no Actions expressions in a run block, not even in a comment.
            body=$(gh release view "$tag" --json body --jq '.body' 2>/dev/null) || continue
            version="${tag#v}"
            c1=✅; c2=✅

            # --- Check 1: lead with prose, not a git-cliff version heading. ---
            first=$(printf '%s' "$body" | grep -m1 -v '^[[:space:]]*$' || true)
            if printf '%s' "$first" | grep -qE '^## \['; then
              c1="❌ autogenerated"
              echo "::error title=Release notes not hand-authored::$tag still carries the autogenerated body. Write a thematic summary and apply it with 'gh release edit $tag --notes-file <file>'."
              bad="$bad $tag"
            fi

            # --- Check 2: no other version's section heading. ---
            stray=$(printf '%s' "$body" | grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' | tr -d '#[] ' | sort -u | grep -v "^${version}$" || true)
            if [ -n "$stray" ]; then
              joined=$(printf '%s' "$stray" | tr '\n' ' ')
              c2="❌ carries $joined"
              echo "::error title=Release notes describe the wrong version::$tag carries section heading(s) for: $joined"
              case " $bad " in *" $tag "*) ;; *) bad="$bad $tag" ;; esac
            fi

            echo "| \`$tag\` | $c1 | $c2 |" >> "$GITHUB_STEP_SUMMARY"
          done

          bad=$(echo $bad | xargs || true)
          echo "bad=$bad" >> "$GITHUB_OUTPUT"
          [ -z "$bad" ] || echo "failing tags: $bad"

      # A run's conclusion is immutable, so a red run never turns green — only a newer run does.
      # The issue is the durable, self-clearing signal: opened when a body is bad, closed when an
      # edit fixes it (the `release: edited` trigger is what re-runs this).
      - name: Open or close the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BAD: ${{ steps.check.outputs.bad }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          title="release notes: hand-authored bodies missing or mismatched"
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
                       --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)

          if [ -n "${BAD:-}" ]; then
            list=$(for t in $BAD; do echo "- \`$t\`"; done)
            body=$(printf '%s\n' \
              "These GitHub Releases do not pass the release-notes gate:" "" "$list" "" \
              "A release body must be hand-authored prose — a one-to-two paragraph thematic summary naming" \
              "the release's major theme(s) and the *why*, followed by the categorized per-issue detail" \
              "(the matching CHANGELOG section). See \`docs/project-management.md\` → *Cutting a release*." "" \
              "Fix each with:" "" \
              "    gh release edit <tag> --notes-file <file>" "" \
              "Editing a body re-triggers this gate, which closes this issue automatically once all pass." "" \
              "Run: $RUN_URL")
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body "$body" >/dev/null
              echo "updated tracking issue #$existing"
            else
              gh issue create --title "$title" --label documentation --body "$body" >/dev/null
              echo "opened tracking issue"
            fi
            exit 1
          fi

          if [ -n "$existing" ]; then
            gh issue close "$existing" --reason completed \
              --comment "All release notes now pass the gate. Closed automatically by $RUN_URL"
            echo "closed tracking issue #$existing"
          fi
          echo "all checked release notes pass the gate"
