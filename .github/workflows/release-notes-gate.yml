name: Release notes gate

# Two defects this catches, both of which really happened and neither of which anything noticed:
#
#   1. A release published with git-cliff's autogenerated body and never hand-authored. v0.3.9
#      shipped this way — six PR-level bullets, no thematic summary — while the release process
#      recorded step 6 as done.
#   2. A release carrying ANOTHER version's notes. `gh release edit` was pointed at the wrong tag
#      at least twice: v0.3.9's notes landed on v0.3.8, and v0.2.5's on v0.2.6. Both times the
#      clobbered release advertised features it did not contain.
#
# WHY THIS IS NOT A STEP IN release.yml: that workflow publishes the git-cliff body itself, so a
# check running inside it would fail on every release by construction — the prose is applied after
# the workflow completes (`softprops/action-gh-release` overwrites the body, which is the timing
# race that bit v0.3.8). A permanently-red check is one everyone learns to ignore. Triggering on
# the `release` event instead means this re-runs when the body is EDITED, so it goes green on its
# own once the notes are written. The failed run stays failed — a run's conclusion is immutable —
# but the latest run reflects current truth, and the tracking issue below closes itself.
#
# CAVEAT: edits made with GITHUB_TOKEN inside Actions do not re-trigger workflows (GitHub's
# recursion guard). Hand edits via `gh` use a user token and do re-trigger. If the prose step is
# ever automated inside Actions, it needs a PAT or this gate will not re-fire.

on:
  release:
    types: [published, edited]

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Release notes are hand-authored and describe this tag
    runs-on: ubuntu-latest
    steps:
      - name: Check the release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -uo pipefail

          # Read the body through the API rather than interpolating
          # ${{ github.event.release.body }} into this script — release bodies are
          # attacker-influenced text and would be a shell-injection vector.
          body=$(gh release view "$TAG" --json body --jq '.body')
          version="${TAG#v}"
          fail=0
          {
            echo "## Release notes gate — \`$TAG\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # --- Check 1: the body must lead with prose, not a git-cliff version heading. ---
          first=$(printf '%s' "$body" | grep -m1 -v '^[[:space:]]*$' || true)
          if printf '%s' "$first" | grep -qE '^## \['; then
            echo "::error title=Release notes not hand-authored::$TAG still carries the autogenerated body. Write a thematic summary and apply it with 'gh release edit $TAG --notes-file <file>'."
            echo "- ❌ **Not hand-authored** — body still begins with the git-cliff heading \`$first\`" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          else
            echo "- ✅ Leads with prose, not the autogenerated heading" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- Check 2: the body must not carry another version's section heading. ---
          stray=$(printf '%s' "$body" | grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' | tr -d '#[] ' | sort -u | grep -v "^${version}$" || true)
          if [ -n "$stray" ]; then
            joined=$(printf '%s' "$stray" | tr '\n' ' ')
            echo "::error title=Release notes describe the wrong version::$TAG carries section heading(s) for: $joined"
            echo "- ❌ **Wrong version** — body carries heading(s) for \`$joined\`, not \`$version\`" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          else
            echo "- ✅ No heading for a version other than \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "FAIL=$fail" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # A run's conclusion is immutable, so the red run above never turns green. The issue is the
      # durable, self-clearing signal: opened when the body is bad, closed when an edit fixes it.
      - name: Open or close the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -uo pipefail
          title="release notes: $TAG needs a hand-authored body"
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
                       --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)

          if [ "${FAIL:-0}" = "1" ]; then
            if [ -n "$existing" ]; then
              echo "tracking issue #$existing already open"
            else
              gh issue create --title "$title" --label documentation --body "$(cat <<EOF
          The GitHub Release for \`$TAG\` did not pass the release-notes gate.

          A release body must be hand-authored prose — a one-to-two paragraph thematic summary naming
          the release's major theme(s) and the *why*, followed by the categorized per-issue detail
          (the \`[$VERSION]\` CHANGELOG section). See \`docs/project-management.md\` → *Cutting a release*.

          Fix it with:

              gh release edit $TAG --notes-file <file>

          Editing the body re-triggers this gate, which closes this issue automatically once it passes.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"
            fi
            exit 1
          fi

          if [ -n "$existing" ]; then
            gh issue close "$existing" --reason completed \
              --comment "Release notes for \`$TAG\` now pass the gate. Closed automatically."
            echo "closed tracking issue #$existing"
          fi
          echo "release notes for $TAG pass the gate"
