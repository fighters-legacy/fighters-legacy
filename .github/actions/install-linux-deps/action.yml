name: 'Install Linux dependencies'
description: 'Install apt packages for fighters-legacy Linux CI builds'

inputs:
  vulkan:
    description: 'Install Vulkan dev packages (libvulkan-dev glslang-tools)'
    default: 'false'
  gcc:
    description: 'Install GCC and G++'
    default: 'false'
  clang:
    description: 'Install Clang compiler'
    default: 'false'
  clang_format:
    description: 'Install clang-format-22 (adds LLVM 22 apt repo)'
    default: 'false'
  python_tools:
    description: 'Install python3-gdal python3-numpy python3-pytest'
    default: 'false'
  lcov:
    description: 'Install lcov for coverage'
    default: 'false'
  gns:
    description: 'Install GameNetworkingSockets deps (OpenSSL + protobuf) for FL_ENABLE_GNS'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Add LLVM 22 apt repository
      if: inputs.clang_format == 'true'
      shell: bash
      run: |
        wget --timeout=15 --tries=3 -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
          | sudo tee /etc/apt/sources.list.d/llvm-22.list

    # Inputs arrive as environment variables, never as ${{ }} inside the script. Actions
    # substitutes expressions before the script is written, so an input's text would be shell
    # source rather than a value. Every caller here passes a literal 'true'/'false', so this is
    # hardening rather than a live hole — but the rule is absolute so it needs no exceptions,
    # and tools/lint_workflow_expressions.py enforces it.
    - name: Install apt packages
      shell: bash
      env:
        WANT_VULKAN: ${{ inputs.vulkan }}
        WANT_GCC: ${{ inputs.gcc }}
        WANT_CLANG: ${{ inputs.clang }}
        WANT_CLANG_FORMAT: ${{ inputs.clang_format }}
        WANT_PYTHON_TOOLS: ${{ inputs.python_tools }}
        WANT_LCOV: ${{ inputs.lcov }}
        WANT_GNS: ${{ inputs.gns }}
      run: |
        # libzstd-dev: engine-compress (#775) is in every build; system-preferred saves the FetchContent build.
        # libcurl4-openssl-dev: platform-http libcurl backend (#490); without it the HTTP backend is disabled.
        pkgs="ninja-build cmake libzstd-dev libcurl4-openssl-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev libxrender-dev libxinerama-dev libxxf86vm-dev libxkbcommon-dev libxtst-dev"
        if [ "$WANT_VULKAN" = "true" ]; then
          pkgs="$pkgs libvulkan-dev glslang-tools"
        fi
        if [ "$WANT_GCC" = "true" ]; then
          pkgs="$pkgs gcc g++"
        fi
        if [ "$WANT_CLANG" = "true" ]; then
          pkgs="$pkgs clang"
        fi
        if [ "$WANT_CLANG_FORMAT" = "true" ]; then
          pkgs="$pkgs clang-format-22"
        fi
        if [ "$WANT_PYTHON_TOOLS" = "true" ]; then
          pkgs="$pkgs python3-gdal python3-numpy python3-netcdf4 python3-pytest"
        fi
        if [ "$WANT_LCOV" = "true" ]; then
          pkgs="$pkgs lcov"
        fi
        if [ "$WANT_GNS" = "true" ]; then
          # GameNetworkingSockets deps: OpenSSL crypto + system protobuf (compiler + libs). protobuf
          # is system-preferred (find_package); no abseil since GNS is built with ICE/WebRTC off.
          pkgs="$pkgs libssl-dev libprotobuf-dev protobuf-compiler pkg-config"
        fi
        # Bounded apt (#1216). On 2026-08-18 an unreachable Azure apt mirror parked EIGHT jobs
        # across four PRs in this step's `apt-get update` — the longest for 95 minutes, reading
        # `pending` the whole time, indistinguishable from a slow leg. Nothing in stock apt bounds
        # a dead mirror, so: fail each fetch fast (15 s, 3 retries), and if update still fails,
        # drop the runner's preconfigured Azure mirror from its mirror list (the runners resolve
        # archive.ubuntu.com via mirror+file:/etc/apt/apt-mirrors.txt) and try once more against
        # the canonical archive. Belt and braces with the per-job timeout-minutes the workflows
        # carry for the same incident — do not remove either as noise.
        #
        # Error-Mode=any is load-bearing: WITHOUT it `apt-get update` exits 0 when every index
        # fetch fails ("Some index files failed to download. They have been ignored"), so the
        # fallback below would never trigger and the failure would surface later as missing
        # packages. Measured in an ubuntu:24.04 container against a blackholed mirror: fails in
        # 22 s with these options, recovers via the mirror drop in 4 s.
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
        UPDATE_OPTS="$APT_OPTS -o APT::Update::Error-Mode=any"
        if ! sudo apt-get $UPDATE_OPTS update; then
          echo "::warning::apt-get update failed; dropping the Azure mirror and retrying (#1216)"
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get $UPDATE_OPTS update
        fi
        sudo apt-get $APT_OPTS install -y $pkgs
