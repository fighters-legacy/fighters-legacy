#
# systemd hardening drop-in for the GitHub Actions self-hosted runner (issue #569).
# Installed by setup-self-hosted-runner.sh to:
#   /etc/systemd/system/actions.runner.<owner>-<repo>.<name>.service.d/hardening.conf
#
# Compensating controls for a NON-EPHEMERAL runner on a PUBLIC repo (the workflow guard already keeps
# fork/pull_request code off this box; these narrow the blast radius further). The runner still needs
# to write its work tree and reach GitHub, so we do not isolate the network and we grant exactly one
# writable path.
[Service]
# No path outside the runner home may be written; /usr,/boot,/etc are read-only.
ProtectSystem=strict
ReadWritePaths=/opt/actions-runner
# Other users' homes are invisible; the runner user's home is /opt/actions-runner (not under /home).
ProtectHome=true
# Private /tmp (build scratch) + no privilege escalation from any job step.
PrivateTmp=true
NoNewPrivileges=true

# --- CPU / memory pinning (NOT needed in the reference VM) ---------------------------------------
# The Vagrant guest is provisioned as exactly 8 vCPU / 16 GB, so it already IS the reference profile.
# Uncomment ONLY when running the runner on a bare box larger than the reference spec, to pin the
# service's cgroup slice to 8 cores / 16 GB (see the hybrid-CPU / CPUSET caveats in README.md):
# AllowedCPUs=0-7
# MemoryMax=16G
